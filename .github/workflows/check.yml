name: Check server source
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test authorization and request compatibility
        run: |
          node --test tools/check-ali-request-policy.test.mjs tools/check-source-verification.test.mjs tools/check-uc-tv-credentials.test.mjs tools/check-ali-web.test.mjs tools/check-subscription-retry.test.mjs
          node tools/check-native-cat-sync.mjs
          node tools/check-cat-account-sync.mjs
          node tools/check-ali-api-response.mjs
          node tools/check-tianyi-verification-ui.mjs
          node --test tools/check-catalogue-authorization.test.mjs tools/check-cat-native-pan123.test.mjs tools/check-builtin-cat.test.mjs
      - name: Build deployment image
        run: docker build --tag okbox-list:ci .

