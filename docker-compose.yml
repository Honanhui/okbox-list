name: okbox-list

services:
  okbox-list:
    image: ${OKBOX_IMAGE:-honamhui/okbox-list:0.3}
    container_name: okbox-list
    restart: unless-stopped
    ports:
      - "${OKBOX_PORT:-9978}:9978"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NODE_ENV: production
      HOST: "::"
      PORT: "9978"
      CONFIG_PATH: /data/config.json
      PUBLIC_BASE_URL: ${OKBOX_PUBLIC_BASE_URL:-}
      ADMIN_TOKEN: ${OKBOX_ADMIN_TOKEN:-}
    volumes:
      - okbox_list_data:/data
    stop_grace_period: 15s

volumes:
  okbox_list_data:
    name: ${OKBOX_DATA_VOLUME:-okbox-list-data}
